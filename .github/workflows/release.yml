# Publish a release when a version tag is pushed (tools/release.mjs creates the tag locally; a person pushes it).
# Checks tag == plugin header Version == LB_VERSION, lints on PHP 7.4 and 8.3, builds launch-builder.zip with
# `git archive` (top folder launch-builder/, .gitattributes export-ignore honoured), and creates or updates the GitHub
# release with the CHANGELOG section as notes and the zip attached. The WordPress updater (includes/core/class-updater.php)
# installs that zip.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/ci.yml

  release:
    needs: lint
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tag == header Version == LB_VERSION == readme Stable tag
        run: node tools/release.mjs verify "$TAG"
      - name: Shipping files are clean
        run: node tools/release.mjs check --ref HEAD
      - name: Build launch-builder.zip
        run: node tools/release.mjs build --ref HEAD --out dist
      - name: Release notes from CHANGELOG.md
        run: node tools/release.mjs notes "$TAG" > dist/notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PRE=false
          case "$VERSION" in *-*) PRE=true ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/launch-builder.zip --clobber
            gh release edit "$TAG" --title "Launch Builder $VERSION" --notes-file dist/notes.md --prerelease="$PRE" --draft=false
          else
            # Created as a draft with the zip attached, then published: the updater never sees a release without its zip.
            gh release create "$TAG" dist/launch-builder.zip --verify-tag --draft --title "Launch Builder $VERSION" --notes-file dist/notes.md --prerelease="$PRE"
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json url,assets --jq '.url + "  " + ([.assets[].name] | join(", "))'
